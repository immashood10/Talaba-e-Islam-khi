# Example nginx config for production deployment of the streaming pipeline.
#
#   Cameras -> ATEM/OBS/vMix -> RTMP/SRT -> MediaMTX -> WebRTC/HLS -> nginx -> viewers
#
# nginx fronts the HTTP-based playback (WebRTC signaling + HLS) with TLS.
# RTMP (1935) and SRT (8890/udp) go straight to MediaMTX - do NOT proxy
# them through nginx's http block.
#
# After deploying, set in the Next.js app's environment:
#   MEDIAMTX_PUBLIC_WEBRTC_URL=https://stream.example.com/webrtc
#   MEDIAMTX_PUBLIC_HLS_URL=https://stream.example.com/hls
#
# WebRTC also needs mediamtx.yml's webrtcAdditionalHosts set to the
# server's public IP, and UDP port 8189 open in the firewall.

server {
    listen 443 ssl;
    server_name stream.example.com;

    ssl_certificate /etc/letsencrypt/live/stream.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.example.com/privkey.pem;

    # WebRTC player + WHEP signaling (MediaMTX :8889)
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HLS playlists + segments (MediaMTX :8888)
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;

        # HLS segments are immutable; let nginx take the load off MediaMTX
        proxy_cache_valid 200 1s;
        add_header Access-Control-Allow-Origin *;
    }

    # Socket.IO live-status service (real-time status + viewer count).
    # Set NEXT_PUBLIC_STATUS_URL=https://stream.example.com in the app's env
    # so browsers connect through this proxy instead of port 4000 directly.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
